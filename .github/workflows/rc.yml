name: Release candidate
run-name: "RC ${{ github.event.client_payload.version }}: build and package, no publish"

# Answers core's `core-rc` dispatch for a vX.Y.0-rc.N tag (Lpdf-devcycle.md
# §4.2 in lpdfio/lpdf). Builds and packages this repo's main with the RC
# engine and keeps the .vsix as a run artifact. Publishes nothing: no
# Marketplace, no tag, no changelog, no GitHub Release, and no publishing
# secret is used. release.yml stays the only path to the Marketplace.
#
# What it tests: the unit tests, and the browser tests, which drive the viewer
# and the diff view in Chrome, run on the source tree before packaging. Then the
# smoke test (test/vsix/smoke.mjs) runs on the .vsix itself: the files the
# extension loads are in it, and every template renders through the packaged
# engine to a PDF that the packaged PDF.js opens. A failure in any of them fails
# the run, and no .vsix is kept.
#
# What is still checked by hand: the extension inside VS Code. Install the .vsix
# (`make rc-vsix` in lpdfio/lpdf), open an example, and look at preview and export.

on:
  repository_dispatch:
    types: [core-rc]

permissions:
  contents: read

jobs:
  rc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for "Unreleased commits"

      # ── Resolve version ──────────────────────────────────────────────────────
      # The payload is the core RC tag itself. Unlike release.yml, nothing is
      # derived from it: stripping the last number of v0.17.0-rc.1 would give
      # v0.17.0-rc.0.
      - name: Resolve version
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if ! echo "$PAYLOAD_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.0-rc\.[0-9]+$'; then
            echo "::error::Expected a core release-candidate tag like v0.17.0-rc.1, got '$PAYLOAD_VERSION'"
            exit 1
          fi
          echo "CORE_TAG=$PAYLOAD_VERSION"          >> "$GITHUB_ENV"
          echo "FINAL_TAG=${PAYLOAD_VERSION%-rc.*}" >> "$GITHUB_ENV"

      # ── Download wasm-pack artifacts from the RC pre-release ─────────────────
      # No fallback: a build with any other engine proves nothing about this RC.
      - name: Download wasm-pack artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --dir wasm \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download core RC $CORE_TAG."
            exit 1
          fi

      # ── Download the schema at the RC tag ────────────────────────────────────
      # schema/lpdf.xsd is not committed: like the engine, it comes from the RC
      # tag, so the .vsix validates documents against the schema this engine
      # reads. It is in core's tree at the tag, not among the release assets.
      - name: Download schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p schema
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/lpdfio/lpdf/contents/schema/lpdf.xsd?ref=$CORE_TAG" > schema/lpdf.xsd \
            || { echo "::error::Could not download schema/lpdf.xsd at core RC $CORE_TAG"; exit 1; }

      # ── Build and package ────────────────────────────────────────────────────
      # The package.json version stays the repo's placeholder: this .vsix is for
      # installing by hand, never for the Marketplace.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install and build
        run: npm ci && npm run build

      # ── Test ─────────────────────────────────────────────────────────────────
      # Unit tests, then the browser tests: the viewer and the diff view driven in
      # the Chrome that the runner image carries (test/browser/support.mjs finds it).
      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # What the browser suites saw, for working out why one failed.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-screenshots
          path: test/browser/.out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Package extension
        run: npx vsce package --out lpdf.vsix

      # Before the upload, so a .vsix that fails it is never offered for the check by hand.
      - name: Smoke-test the package
        run: npm run test:vsix

      - name: Upload .vsix
        uses: actions/upload-artifact@v6
        with:
          name: lpdf-${{ env.CORE_TAG }}
          path: lpdf.vsix
          retention-days: 14

      # ── What ships from this repo ────────────────────────────────────────────
      # The final core release publishes this repo's main as it stands. Anything
      # on main since the last release tag ships in FINAL_TAG with only core's
      # release notes (Lpdf-devcycle.md §4.1). Runs even if the build failed.
      # Skips the bots' own "changelog: …" commits.
      - name: Unreleased commits
        if: always()
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          COMMITS=""
          if [ -n "$LAST" ]; then
            COMMITS=$(git log --oneline --no-merges --invert-grep \
              --grep='^changelog: ' --grep='^release: ' "$LAST..HEAD")
          fi
          {
            echo "### $REPO: release candidate $CORE_TAG"
            echo
            echo "Automated: the unit and browser tests on the source tree, then the smoke test on lpdf.vsix (the files the extension loads, and every template rendered by the packaged engine). The job fails if any of them fails. None of them runs VS Code, so install lpdf.vsix from this run (\`code --install-extension lpdf.vsix\`), open an example, and check preview and export."
            echo
            if [ -z "$LAST" ]; then
              echo "No release tag in this repo yet."
            elif [ -z "$COMMITS" ]; then
              echo "Nothing unreleased since $LAST. $FINAL_TAG changes only the engine."
            else
              echo "Unreleased since $LAST. These ship in $FINAL_TAG, with only core's release notes:"
              echo
              echo '```'
              echo "$COMMITS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$COMMITS" ]; then
            echo "::notice::$(echo "$COMMITS" | wc -l | tr -d ' ') unreleased commit(s) since $LAST will ship in $FINAL_TAG"
          fi
