name: Marketplace identity probe

# One-off. Prints the Marketplace (Visual Studio) profile id of the Azure managed
# identity, which is the id to add as a Contributor under Members on the lpdfio
# publisher. Only the identity itself can read it, so it has to be read from a
# job that has logged in as that identity. Delete this file after use.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Read the Marketplace profile id
        run: |
          az rest \
            -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798
