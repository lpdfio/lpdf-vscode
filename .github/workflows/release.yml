name: Release
run-name: "Release ${{ github.event.client_payload.version || github.ref_name }} to VS Marketplace (${{ github.event_name == 'repository_dispatch' && 'core' || 'adapter' }})"

on:
  repository_dispatch:
    types: [core-release]
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    # The Azure federated credential is bound to the environment name, so the job must declare it
    # to get a token (Lpdf-vscode-publish.md), and each of the two names has a credential of its own.
    # A run dispatched by core's release was approved there, on core's `release`. A package patch is
    # a tag pushed here, and waits for the approval of `vscode-marketplace`.
    environment: ${{ github.event_name == 'repository_dispatch' && 'vscode-marketplace-core' || 'vscode-marketplace' }}
    permissions:
      actions: read      # lists this repo's rc.yml runs, for the check after "Resolve version"
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      # ── Resolve version ──────────────────────────────────────────────────────
      - name: Resolve version
        run: |
          ADAPTER_TAG="${{ github.event.client_payload.version || github.ref_name }}"
          CORE_TAG=$(echo "$ADAPTER_TAG" | sed 's/\.[0-9]*$/.0/')
          VERSION="${ADAPTER_TAG#v}"
          echo "ADAPTER_TAG=$ADAPTER_TAG"   >> "$GITHUB_ENV"
          echo "CORE_TAG=$CORE_TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"           >> "$GITHUB_ENV"

      # ── Require main to be what the release candidate tested ─────────────────
      # A core release is approved once, on core's `release`, so this run waits for nobody. This
      # check stands where the other clicks did. This repo's rc.yml built and tested `main` as it was
      # when the RC was dispatched, and this run builds `main` as it is now: the two must be the same
      # commit, apart from the bots' changelog and release commits, or what ships was never tested
      # by an RC. Another RC on the same core commit tests the newer `main`; then send this repo
      # `core-release` again, since a re-run builds the commit of the first run.
      # A package patch is released by pushing its tag. It has no RC, and keeps its approval.
      - name: Require main to be what the release candidate tested
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$ADAPTER_TAG" != "$CORE_TAG" ]; then
            echo "::error::A core release dispatches vX.Y.0, and this dispatch carries $ADAPTER_TAG. A package patch is released by pushing its tag."
            exit 1
          fi

          # The newest RC of this version on the commit being released that has a green run here.
          RELEASE_SHA=$(gh api "repos/lpdfio/lpdf/commits/$CORE_TAG" --jq .sha)
          RC_TAG=""
          for RC in $(gh api "repos/lpdfio/lpdf/git/matching-refs/tags/${CORE_TAG}-rc." --jq '.[].ref | ltrimstr("refs/tags/")' | sort -V -r); do
            [ "$(gh api "repos/lpdfio/lpdf/commits/$RC" --jq .sha)" = "$RELEASE_SHA" ] || continue
            RC_SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow rc.yml --event repository_dispatch --status success --limit 100 \
              --json displayTitle,headSha | jq -r --arg title "RC $RC:" 'map(select(.displayTitle | startswith($title))) | .[0].headSha // empty')
            if [ -n "$RC_SHA" ]; then RC_TAG=$RC; break; fi
          done
          if [ -z "$RC_TAG" ]; then
            echo "::error::No green rc.yml run here for a release candidate of $CORE_TAG on its commit ${RELEASE_SHA:0:7}. Cut one, and check its runs, before releasing."
            exit 1
          fi

          COMPARE=$(gh api "repos/$GITHUB_REPOSITORY/compare/$RC_SHA...$GITHUB_SHA")
          STATUS=$(jq -r .status <<<"$COMPARE")
          NEWER=$(jq -r '.commits[] | select(.commit.message | test("^(changelog|release): ") | not) | "  \(.sha[0:7]) \(.commit.message | split("\n")[0])"' <<<"$COMPARE")
          if { [ "$STATUS" != identical ] && [ "$STATUS" != ahead ]; } || [ -n "$NEWER" ]; then
            echo "::error::main has moved since $RC_TAG was tested: rc.yml ran on ${RC_SHA:0:7} and this run builds ${GITHUB_SHA:0:7} ($STATUS). Cut another RC on ${RELEASE_SHA:0:7}, then send this repo core-release again."
            [ -z "$NEWER" ] || printf 'Commits since %s:\n%s\n' "${RC_SHA:0:7}" "$NEWER"
            exit 1
          fi
          echo "main is ${GITHUB_SHA:0:7}, the commit $RC_TAG tested here (${RC_SHA:0:7})."

      # ── Download wasm-pack artifacts from core release ───────────────────────
      # VS Code extension expects wasm/lpdf.js and wasm/lpdf_bg.wasm
      - name: Download wasm-pack artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          DOWNLOADED=""
          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --dir wasm \
              --clobber && DOWNLOADED=1 && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          # No fallback to the latest core: vX.Y.Z must ship engine vX.Y.0
          # (var/VERSIONING.md in lpdfio/lpdf). ci.yml keeps its fallback.
          if [ -z "$DOWNLOADED" ]; then
            echo "::error::Could not download core $CORE_TAG. This release must ship engine $CORE_TAG — publish that core release first, or check the tag."
            exit 1
          fi

      # ── Download the schema at the core tag ──────────────────────────────────
      # schema/lpdf.xsd is not committed: like the engine, it comes from
      # CORE_TAG, so the published extension validates documents against the
      # schema its engine reads. It is in core's tree at the tag, not among the
      # release assets.
      - name: Download schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p schema
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/lpdfio/lpdf/contents/schema/lpdf.xsd?ref=$CORE_TAG" > schema/lpdf.xsd \
            || { echo "::error::Could not download schema/lpdf.xsd at core $CORE_TAG"; exit 1; }

      # ── Build ────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set version in package.json
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install and build
        run: npm ci && npm run build

      # ── Test ─────────────────────────────────────────────────────────────────
      # Unit tests, then the browser tests: the viewer and the diff view driven in
      # the Chrome that the runner image carries (test/browser/support.mjs finds it).
      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # What the browser suites saw, for working out why one failed.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-screenshots
          path: test/browser/.out/
          if-no-files-found: ignore
          retention-days: 7

      # ── Changelog: prepare ───────────────────────────────────────────────────
      # Unlike the SDK adapters, the entry is written BEFORE packaging: the
      # Marketplace's Changelog tab shows the CHANGELOG.md inside the .vsix, so an
      # entry added after `vsce package` would always be one version behind.
      #
      # This step only edits the working tree. Nothing reaches main until
      # "Commit CHANGELOG.md" below, which runs after publish — so a failed
      # publish never leaves an entry on main for a version that didn't ship.
      #
      # Fails the job on error, deliberately — this path is unproven. Relax to
      # warn-only once a release has exercised it (changelog-plan.md, "Rollout").
      - name: Prepare CHANGELOG entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Core cascade. Nobody types notes on this path — nobody can — so
            # copy core's verbatim. Core publishes its release before
            # dispatching, so the body is always readable by now.
            BODY=$(gh release view "$CORE_TAG" --repo lpdfio/lpdf --json body -q .body | tr -d '\r')
            HEADER="## $ADAPTER_TAG (core) — $(date -u +%F)"
          else
            # Adapter-only patch: the notes typed on this repo's own release.
            BODY=$(gh release view "$ADAPTER_TAG" --json body        -q .body        | tr -d '\r')
            DATE=$(gh release view "$ADAPTER_TAG" --json publishedAt -q .publishedAt | cut -c1-10)
            if [ -z "$DATE" ]; then
              echo "::error::$ADAPTER_TAG has no published release — was the tag pushed without one?"
              exit 1
            fi
            HEADER="## $ADAPTER_TAG — $DATE"
          fi

          # Hand the entry to the commit and release steps below (multi-line safe).
          {
            echo "CHANGELOG_HEADER=$HEADER"
            echo 'RELEASE_BODY<<__LPDF_BODY__'
            printf '%s\n' "$BODY"
            echo '__LPDF_BODY__'
          } >> "$GITHUB_ENV"

          if ! head -n 1 CHANGELOG.md | grep -qx '# Changelog'; then
            echo "::error::CHANGELOG.md must start with a '# Changelog' line"
            exit 1
          fi

          # Re-runs must not duplicate an entry.
          if grep -q "^## $ADAPTER_TAG " CHANGELOG.md; then
            echo "$ADAPTER_TAG is already in CHANGELOG.md — nothing to do"
            exit 0
          fi

          # Prepend only. Never reformat or reorder what is already there —
          # the file is hand-editable by design.
          {
            echo "# Changelog"
            echo
            echo "$HEADER"
            if [ -n "$BODY" ]; then printf '%s\n' "$BODY"; fi
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

      # ── Package and publish ───────────────────────────────────────────────────
      # The tests ran after the build above, before anything was changed for the release.
      - name: Package extension
        run: npx vsce package --out lpdf.vsix

      # Kept on the run so the packaged CHANGELOG.md — what the Marketplace's
      # Changelog tab will show — can be checked, and the build installed by hand.
      - name: Upload .vsix
        uses: actions/upload-artifact@v6
        with:
          name: lpdf-${{ env.VERSION }}
          path: lpdf.vsix

      # No stored token: GitHub's OIDC token is exchanged for a short-lived Azure
      # one by the managed identity lpdf-vscode-publisher, which is a Contributor
      # on the lpdfio publisher.
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath lpdf.vsix --azure-credential

      # ── Changelog: commit ────────────────────────────────────────────────────
      # main's ruleset takes changes through a PR only, and the lpdf release App
      # is its one bypass actor. So the commit below is pushed with a token of
      # that App, minted here for this repo. The App's key is a secret of this
      # job's environments, never of the repo. `vscode-marketplace` waits for the
      # user's approval. `vscode-marketplace-core` has no reviewer, so it is
      # limited to main: only a workflow merged there can read the key.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.LPDF_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LPDF_RELEASE_APP_PRIVATE_KEY }}

      # Writes the prepared entry onto main. Runs after publish, and before the
      # tag is created so the tag contains its own entry.
      - name: Commit CHANGELOG.md
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Drop the in-job edits — the version bump is deliberately never
          # committed and would block the branch switch, and the prepared entry
          # is re-applied against main's tip below.
          git checkout -- .

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

          if ! head -n 1 CHANGELOG.md | grep -qx '# Changelog'; then
            echo "::error::CHANGELOG.md must start with a '# Changelog' line"
            exit 1
          fi

          # Re-runs must not duplicate an entry.
          if grep -q "^## $ADAPTER_TAG " CHANGELOG.md; then
            echo "$ADAPTER_TAG is already in CHANGELOG.md on main — nothing to do"
            exit 0
          fi

          {
            echo "# Changelog"
            echo
            echo "$CHANGELOG_HEADER"
            if [ -n "$RELEASE_BODY" ]; then printf '%s\n' "$RELEASE_BODY"; fi
            tail -n +2 CHANGELOG.md
          } > CHANGELOG.next
          mv CHANGELOG.next CHANGELOG.md

          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "changelog: $ADAPTER_TAG"
          # As the App: the empty extraheader drops the GITHUB_TOKEN header that
          # checkout set, so git sends the App token from the URL instead.
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main

      # ── Create GitHub Release (core-triggered only) ──────────────────────────
      # --notes carries core's text onto this repo's Releases page, which
      # otherwise shows a bare "Full Changelog" compare link. --generate-notes
      # remains the fallback for an empty core body.
      - name: Create GitHub Release
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "$ADAPTER_TAG"
          git push origin "$ADAPTER_TAG"
          if [ -n "${RELEASE_BODY:-}" ]; then
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --notes "$RELEASE_BODY"
          else
            gh release create "$ADAPTER_TAG" \
              --title "$ADAPTER_TAG" \
              --generate-notes
          fi
