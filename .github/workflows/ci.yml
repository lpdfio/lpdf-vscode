name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ── Download wasm-pack artifacts ─────────────────────────────────────────
      # The newest core release that has its engine files, pre-releases included,
      # as in the SDKs. `main` is built against the engine it will ship with, and
      # between a core RC and its final release that engine is the RC: a format
      # change reaches this repo before the release that carries it, so building
      # against the core of the last extension release fails for that whole
      # window. rc.yml and release.yml stay pinned to the tag they ship.
      # Not simply the newest release: core publishes a release a few minutes
      # before the build uploads its assets, and it is empty during that window.
      - name: Download wasm artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          CORE_TAG=$(gh api repos/lpdfio/lpdf/releases \
            --jq '[.[] | select((.draft | not) and any(.assets[]; .name == "lpdf_bg.wasm"))][0].tag_name // empty')
          if [ -z "$CORE_TAG" ]; then
            echo "::error::No lpdfio/lpdf release has lpdf.js / lpdf_bg.wasm"
            exit 1
          fi
          echo "Resolved core tag: $CORE_TAG"

          for attempt in 1 2 3; do
            gh release download "$CORE_TAG" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --dir wasm \
              --clobber && break
            echo "Attempt $attempt failed — retrying in 10s..."
            sleep 10
          done
          if [ ! -f wasm/lpdf.js ]; then
            echo "::error::Could not download the engine files from core $CORE_TAG"
            exit 1
          fi
          echo "CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"

      # ── Download the schema ──────────────────────────────────────────────────
      # schema/lpdf.xsd is not committed: it comes from the core tag the engine
      # came from, so the unit tests and the package use the schema of that
      # engine. It is in core's tree at the tag, not among the release assets.
      - name: Download schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p schema
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/lpdfio/lpdf/contents/schema/lpdf.xsd?ref=$CORE_TAG" > schema/lpdf.xsd \
            || { echo "::error::Could not download schema/lpdf.xsd at core $CORE_TAG"; exit 1; }
          echo "Schema from core $CORE_TAG"

      - name: Install and build
        run: npm ci && npm run build

      # ── Test ─────────────────────────────────────────────────────────────────
      # Unit tests, then the browser tests: the viewer and the diff view driven in
      # the Chrome that the runner image carries (test/browser/support.mjs finds it).
      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # What the browser suites saw, for working out why one failed.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-screenshots
          path: test/browser/.out/
          if-no-files-found: ignore
          retention-days: 7

      # ── Package, then test the package ───────────────────────────────────────
      # The tests above run on the source tree. The smoke test runs on lpdf.vsix:
      # the files the extension loads are in it, and every template renders
      # through the packaged engine (test/vsix/smoke.mjs).
      - name: Package extension
        run: npx vsce package --out lpdf.vsix

      - name: Smoke-test the package
        run: npm run test:vsix
