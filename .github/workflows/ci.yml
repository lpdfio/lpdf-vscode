name: CI
run-name: "${{ format('CI (build + test): {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message) }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Full history: on a shallow clone, fetch-tags only brings tags that
      # point at the checked-out commit, so the adapter tag resolves to none.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ── Download wasm-pack artifacts ─────────────────────────────────────────
      # Derives the core tag from the latest semver git tag in this repo
      # (strip patch → .0).  Falls back to the newest core release that has
      # its assets when no adapter tag exists yet or the derived tag fails.
      - name: Download wasm artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p wasm
          ADAPTER_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | head -1)
          CORE_TAG=$(echo "${ADAPTER_TAG:-v0.0.0}" | sed 's/\.[0-9]*$/.0/')
          echo "Resolved adapter tag: ${ADAPTER_TAG:-<none>}"
          echo "Resolved core tag: $CORE_TAG"

          download() {
            gh release download "$1" \
              --repo lpdfio/lpdf \
              --pattern "lpdf.js" \
              --pattern "lpdf_bg.wasm" \
              --dir wasm \
              --clobber
          }

          if [ "$CORE_TAG" != "v0.0.0" ]; then
            for attempt in 1 2 3; do
              download "$CORE_TAG" && break
              echo "Attempt $attempt failed — retrying in 10s..."
              sleep 10
            done
          fi

          # Not `latest`: core publishes its release a few minutes before the
          # build uploads the assets, and `latest` is empty during that window.
          if [ ! -f wasm/lpdf.js ]; then
            FALLBACK_TAG=$(gh api repos/lpdfio/lpdf/releases \
              --jq '[.[] | select(((.draft or .prerelease) | not) and any(.assets[]; .name == "lpdf_bg.wasm"))][0].tag_name // empty')
            if [ -z "$FALLBACK_TAG" ]; then
              echo "::error::No lpdfio/lpdf release has lpdf.js / lpdf_bg.wasm"
              exit 1
            fi
            echo "Falling back to newest core release with assets: $FALLBACK_TAG"
            download "$FALLBACK_TAG"
            CORE_TAG=$FALLBACK_TAG
          fi
          echo "CORE_TAG=$CORE_TAG" >> "$GITHUB_ENV"

      # ── Download the schema ──────────────────────────────────────────────────
      # schema/lpdf.xsd is not committed: it comes from the core tag the engine
      # came from, so the unit tests and the package use the schema of that
      # engine. It is in core's tree at the tag, not among the release assets.
      - name: Download schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p schema
          gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/lpdfio/lpdf/contents/schema/lpdf.xsd?ref=$CORE_TAG" > schema/lpdf.xsd \
            || { echo "::error::Could not download schema/lpdf.xsd at core $CORE_TAG"; exit 1; }
          echo "Schema from core $CORE_TAG"

      - name: Install and build
        run: npm ci && npm run build

      # ── Test ─────────────────────────────────────────────────────────────────
      # Unit tests, then the browser tests: the viewer and the diff view driven in
      # the Chrome that the runner image carries (test/browser/support.mjs finds it).
      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:browser

      # What the browser suites saw, for working out why one failed.
      - name: Upload browser test screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-test-screenshots
          path: test/browser/.out/
          if-no-files-found: ignore
          retention-days: 7

      # ── Package, then test the package ───────────────────────────────────────
      # The tests above run on the source tree. The smoke test runs on lpdf.vsix:
      # the files the extension loads are in it, and every template renders
      # through the packaged engine (test/vsix/smoke.mjs).
      - name: Package extension
        run: npx vsce package --out lpdf.vsix

      - name: Smoke-test the package
        run: npm run test:vsix
