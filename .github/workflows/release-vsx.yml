name: Release to Open VSX
run-name: "Open VSX: ${{ inputs.version || github.event.workflow_run.display_title }}"

# Publishes the .vsix that a Release run sent to the VS Code Marketplace to Open VSX, the registry
# of the editors built on VS Code's open-source code (Cursor, VSCodium, Gitpod). It is a workflow of
# its own so that a failure here never stops release.yml's changelog commit or GitHub Release:
# re-running this one is the fix. Run by hand, it publishes the version given, as long as its
# Release run's artifact hasn't expired (90 days).

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as its tag (v0.30.0). Its Release run must be green and under 90 days old."
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # OVSX_PAT is an Open VSX token limited to the lpdfio namespace and to publishing. The environment
    # has no reviewer: the release this follows was approved already, and a manual run is started by
    # hand. It is limited to main, so only a workflow merged there can read the token.
    environment: open-vsx
    permissions:
      actions: read      # finds the Release run and downloads its .vsix
    steps:
      # ── Find the release's .vsix ─────────────────────────────────────────────
      # release.yml uploads the .vsix it published as the artifact lpdf-<version>. After a Release
      # run, that run's. By hand, the newest unexpired artifact of that name, from a green Release run.
      - name: Find the release's .vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ -n "$TRIGGER_RUN_ID" ]; then
            RUN_ID=$TRIGGER_RUN_ID
            ARTIFACT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name | startswith("lpdf-"))] | .[0].name // empty')
            if [ -z "$ARTIFACT" ]; then
              echo "::error::Release run $RUN_ID has no lpdf-<version> artifact."
              exit 1
            fi
          else
            ARTIFACT="lpdf-${INPUT_VERSION#v}"
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$ARTIFACT" \
              --jq '[.artifacts[] | select(.expired | not)] | .[0].workflow_run.id // empty')
            if [ -z "$RUN_ID" ]; then
              echo "::error::No unexpired artifact $ARTIFACT. Artifacts are kept 90 days, so this version can't be published from here."
              exit 1
            fi
            RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '"\(.path) \(.conclusion)"')
            if [ "$RUN" != ".github/workflows/release.yml success" ]; then
              echo "::error::$ARTIFACT comes from run $RUN_ID ($RUN), not a green Release run."
              exit 1
            fi
          fi

          echo "Publishing $ARTIFACT from run $RUN_ID."
          echo "RUN_ID=$RUN_ID"     >> "$GITHUB_ENV"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Download the .vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir vsix

      # ── Publish ──────────────────────────────────────────────────────────────
      # ovsx reads the token from OVSX_PAT. --skip-duplicate lets a re-run pass when the version is
      # already out.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish vsix/lpdf.vsix --skip-duplicate
